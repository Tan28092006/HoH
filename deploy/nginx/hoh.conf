# TLS in front of the MCP endpoint, for a deployment that already runs nginx.
#
# Certificates are obtained elsewhere (certbot, or whatever already issues them
# here). If nothing already renews them, prefer the Caddyfile next to this file:
# a certificate that expires unnoticed takes the whole deployment with it.

server {
    listen 443 ssl;
    http2 on;
    server_name hoh.example.com;

    ssl_certificate     /etc/letsencrypt/live/hoh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoh.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # Agents present a bearer token, which is the whole of the claim. The
    # endpoint refuses an unauthenticated request before dispatch; refusing it
    # here too keeps a credential-less request out of application code.
    location / {
        if ($http_authorization !~* "^Bearer ") {
            return 401 '{"error":{"code":"unauthorized","message":"A bearer credential is required"}}';
        }

        proxy_pass http://127.0.0.1:8931;
        proxy_http_version 1.1;

        # The endpoint authenticates this itself, so it must arrive untouched.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP and SSE hold a response open. With buffering on, every
        # event arrives at once when the connection closes, which reads as an
        # agent that never woke up.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # A held-open stream is not an idle connection. The default read timeout
        # would sever it about once a minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name hoh.example.com;
    # Never serve the endpoint over plain HTTP: a token sent once in the clear
    # is compromised whatever the redirect does afterwards.
    return 308 https://$host$request_uri;
}
