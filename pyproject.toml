[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hoh-control-plane"
version = "0.3.26"
description = "Shared MCP control plane for role-separated AI software teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "mcp>=1.30,<2",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.3,<7",
  "pytest-xdist>=3.6,<4",
]
# Only for a multi-host deployment. A local single-host install runs on SQLite
# with no driver at all, which is why this is not a runtime dependency.
postgres = [
  "psycopg[binary]>=3.2,<4",
]
ui = ["pytest-playwright>=0.7,<1"]

[project.scripts]
hoh-api = "hoh_control_plane.__main__:main"
hoh-mcp = "hoh_control_plane.mcp_server:main"
hoh-scheduler = "hoh_control_plane.scheduler:main"
hoh-agent-kit = "hoh_control_plane.agent_kit:main"
hoh-supervisor = "hoh_control_plane.supervisor:main"
hoh-ops = "hoh_control_plane.operations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hoh_control_plane"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "hoh_control_plane/agent_assets/skills"

[tool.hatch.build.targets.sdist]
include = [
  "src/", "skills/", "tests/", "scripts/", "docs/", "deploy/",
  "README.md", "HOH_MULTI_AGENT_CONTROL_PLANE.md", "pyproject.toml", ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: browser acceptance tests (enable with --run-ui)"]
addopts = [
  "--strict-markers",
  "--cov=hoh_control_plane",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["hoh_control_plane"]

[tool.coverage.report]
show_missing = true
skip_covered = true
